<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Неоновый Кроссворд</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Orbitron', sans-serif;
            background: linear-gradient(135deg, #0a0a0f 0%, #1a0a2e 100%);
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        h1 {
            font-size: 2.5rem;
            color: #00ffff;
            text-shadow: 0 0 10px #00ffff, 0 0 20px #00ffff;
            margin-bottom: 10px;
            animation: glow 2s ease-in-out infinite alternate;
        }

        @keyframes glow {
            from { text-shadow: 0 0 10px #00ffff, 0 0 20px #00ffff; }
            to { text-shadow: 0 0 20px #ff00ff, 0 0 40px #ff00ff; }
        }

        .subtitle {
            color: #ff00ff;
            font-size: 1rem;
            margin-bottom: 30px;
            letter-spacing: 2px;
        }

        .crossword {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
        }

        .cell {
            width: 60px;
            height: 60px;
            background: rgba(0, 255, 255, 0.05);
            border: 2px solid #00ffff;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            font-weight: bold;
            color: #fff;
            text-transform: uppercase;
            transition: all 0.3s;
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.3);
        }

        .cell:focus {
            outline: none;
            border-color: #ff00ff;
            box-shadow: 0 0 20px #ff00ff;
            transform: scale(1.1);
        }

        .cell.correct {
            border-color: #00ff00;
            box-shadow: 0 0 20px #00ff00;
            background: rgba(0, 255, 0, 0.1);
        }

        .cell.wrong {
            border-color: #ff0000;
            box-shadow: 0 0 20px #ff0000;
            animation: shake 0.5s;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        .hint {
            background: rgba(255, 0, 255, 0.1);
            border: 1px solid #ff00ff;
            padding: 15px 25px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 1.1rem;
            text-align: center;
            max-width: 500px;
            box-shadow: 0 0 15px rgba(255, 0, 255, 0.3);
        }

        .hint span {
            color: #ffff00;
            font-weight: bold;
        }

        .btn {
            background: transparent;
            border: 2px solid #00ffff;
            color: #00ffff;
            padding: 12px 30px;
            border-radius: 8px;
            font-family: 'Orbitron', sans-serif;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            margin: 0 10px;
        }

        .btn:hover {
            background: #00ffff;
            color: #000;
            box-shadow: 0 0 20px #00ffff;
        }

        .message {
            margin-top: 20px;
            font-size: 1.2rem;
            min-height: 30px;
            text-align: center;
        }

        .message.success {
            color: #00ff00;
            text-shadow: 0 0 10px #00ff00;
        }

        .message.error {
            color: #ff0000;
            text-shadow: 0 0 10px #ff0000;
        }

        @media (max-width: 600px) {
            h1 { font-size: 1.8rem; }
            .cell { width: 50px; height: 50px; font-size: 1.5rem; }
            .crossword { gap: 5px; }
        }
    </style>
</head>
<body>
    <h1>НЕОНОВЫЙ КРОССВОРД</h1>
    <p class="subtitle">УГАДАЙ СЛОВО ИЗ 5 БУКВ</p>

    <div class="hint">
        💡 Подсказка: <span id="hint-text">Загрузка...</span>
    </div>

    <div class="crossword" id="crossword"></div>

    <div>
        <button class="btn" onclick="checkAnswer()">ПРОВЕРИТЬ</button>
        <button class="btn" onclick="newWord()">НОВОЕ СЛОВО</button>
    </div>

    <div class="message" id="message"></div>

    <script>
        const words = [
            { word: 'КОДЕК', hint: 'Программист, который пишет код' },
            { word: 'ИГРОК', hint: 'Тот, кто играет в игры' },
            { word: 'СЕРВЕР', hint: 'Компьютер, который хранит данные (6 букв)' },
            { word: 'КЛАВИШ', hint: 'Кнопка на клавиатуре' },
            { word: 'МОНИТОР', hint: 'Экран компьютера (7 букв)' },
            { word: 'ПРОЦЕСС', hint: 'Выполняемая программа' },
            { word: 'ПАМЯТЬ', hint: 'Хранилище данных в компьютере (6 букв)' },
            { word: 'ДИСПЛЕЙ', hint: 'Экран устройства (7 букв)' },
            { word: 'КУРСОР', hint: 'Указатель на экране (6 букв)' },
            { word: 'ФАЙЛЫ', hint: 'Документы на компьютере' }
        ];

        let currentWord = null;
        let cells = [];

        function initGame() {
            newWord();
        }

        function newWord() {
            currentWord = words[Math.floor(Math.random() * words.length)];
            document.getElementById('hint-text').textContent = currentWord.hint;
            document.getElementById('message').textContent = '';
            document.getElementById('message').className = 'message';
            
            const crossword = document.getElementById('crossword');
            crossword.innerHTML = '';
            cells = [];

            for (let i = 0; i < currentWord.word.length; i++) {
                const cell = document.createElement('input');
                cell.type = 'text';
                cell.maxLength = 1;
                cell.className = 'cell';
                cell.dataset.index = i;
                
                cell.addEventListener('input', (e) => {
                    e.target.value = e.target.value.toUpperCase();
                    if (e.target.value && i < currentWord.word.length - 1) {
                        cells[i + 1].focus();
                    }
                });

                cell.addEventListener('keydown', (e) => {
                    if (e.key === 'Backspace' && !e.target.value && i > 0) {
                        cells[i - 1].focus();
                    }
                });

                crossword.appendChild(cell);
                cells.push(cell);
            }

            cells[0].focus();
        }

        function checkAnswer() {
            const answer = cells.map(c => c.value).join('');
            const message = document.getElementById('message');

            if (answer.length < currentWord.word.length) {
                message.textContent = 'Заполни все клетки!';
                message.className = 'message error';
                return;
            }

            if (answer === currentWord.word) {
                message.textContent = '🎉 ПРАВИЛЬНО! Отлично!';
                message.className = 'message success';
                cells.forEach(c => c.classList.add('correct'));
                
                setTimeout(() => {
                    if (confirm('Хочешь ещё одно слово?')) {
                        newWord();
                    }
                }, 1500);
            } else {
                message.textContent = '❌ Неправильно, попробуй ещё!';
                message.className = 'message error';
                cells.forEach(c => {
                    c.classList.add('wrong');
                    setTimeout(() => c.classList.remove('wrong'), 500);
                });
            }
        }

        // Enter key to check
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                checkAnswer();
            }
        });

        initGame();
    </script>
</body>
</html>
