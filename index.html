<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Неоновая Судоку Pro</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');

        :root {
            --neon-primary: #00ffff;
            --neon-secondary: #ff00ff;
            --neon-accent: #ffff00;
            --bg-dark: #0a0a0f;
            --bg-panel: #1a0a2e;
            --grid-line: rgba(0, 255, 255, 0.2);
        }

        body.skin-matrix {
            --neon-primary: #00ff00;
            --neon-secondary: #88ff88;
            --neon-accent: #ccffcc;
            --bg-dark: #000000;
            --bg-panel: #051505;
            --grid-line: rgba(0, 255, 0, 0.2);
        }
        body.skin-sunset {
            --neon-primary: #ff9900;
            --neon-secondary: #ff0055;
            --neon-accent: #ffee00;
            --bg-dark: #1a0505;
            --bg-panel: #2e0a1a;
            --grid-line: rgba(255, 153, 0, 0.2);
        }
        body.skin-ice {
            --neon-primary: #aaddff;
            --neon-secondary: #0055ff;
            --neon-accent: #ffffff;
            --bg-dark: #050a1a;
            --bg-panel: #0a152e;
            --grid-line: rgba(170, 221, 255, 0.2);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Orbitron', sans-serif;
            background-color: var(--bg-dark);
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 15px;
            transition: background-color 0.5s ease;
        }

        h1 {
            font-size: 2rem;
            color: var(--neon-primary);
            text-shadow: 0 0 10px var(--neon-primary), 0 0 20px var(--neon-secondary);
            margin-bottom: 5px;
            animation: neonPulse 3s ease-in-out infinite alternate;
        }

        @keyframes neonPulse {
            0% { text-shadow: 0 0 10px var(--neon-primary), 0 0 20px var(--neon-primary); filter: brightness(1); }
            100% { text-shadow: 0 0 20px var(--neon-secondary), 0 0 40px var(--neon-secondary); filter: brightness(1.2); }
        }

        .top-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
            align-items: center;
        }

        .level-info {
            font-size: 1.2rem;
            color: var(--neon-accent);
            text-shadow: 0 0 10px var(--neon-accent);
        }

        .mode-badge {
            font-size: 0.8rem;
            padding: 3px 10px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid var(--neon-secondary);
            color: var(--neon-secondary);
        }
        .mode-badge.blitz {
            background: rgba(255, 0, 85, 0.2);
            border-color: #ff0055;
            color: #ff0055;
            animation: pulseRed 1s infinite;
        }

        @keyframes pulseRed {
            0%, 100% { box-shadow: 0 0 5px #ff0055; }
            50% { box-shadow: 0 0 15px #ff0055; }
        }

        .hint-counter {
            font-size: 0.9rem;
            color: #aaa;
            margin-bottom: 10px;
        }
        .hint-counter span { color: var(--neon-accent); font-weight: bold; }

        /* БЛИЦ-ТАЙМЕР */
        .blitz-timer {
            font-size: 1.8rem;
            color: var(--neon-accent);
            text-shadow: 0 0 10px var(--neon-accent);
            margin-bottom: 10px;
            display: none;
            font-weight: 900;
            letter-spacing: 3px;
        }
        .blitz-timer.active { display: block; }
        .blitz-timer.warning {
            color: #ff0055;
            text-shadow: 0 0 15px #ff0055;
            animation: timerBlink 0.5s infinite;
        }
        @keyframes timerBlink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        .sudoku-grid {
            display: grid;
            grid-template-columns: repeat(9, 1fr);
            gap: 2px;
            background: var(--grid-line);
            padding: 3px;
            border-radius: 8px;
            box-shadow: 0 0 25px var(--grid-line);
            margin-bottom: 20px;
            border: 1px solid var(--neon-primary);
        }

        .cell {
            width: 40px;
            height: 40px;
            background: var(--bg-dark);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }

        .cell:hover { background: rgba(255, 255, 255, 0.05); }
        .cell.selected { background: rgba(255, 0, 255, 0.2); box-shadow: inset 0 0 10px var(--neon-secondary); }
        .cell.given { 
            color: var(--neon-primary); 
            text-shadow: 0 0 5px var(--neon-primary), 0 0 10px var(--neon-primary);
        }
        .cell.user-input { 
            color: #ffffff;
            text-shadow: 
                0 0 5px #ffffff,
                0 0 10px var(--neon-secondary),
                0 0 20px var(--neon-secondary),
                0 0 30px var(--neon-secondary);
            font-weight: 900;
        }
        .cell.error { color: #ff0000 !important; text-shadow: 0 0 10px #ff0000 !important; animation: shake 0.4s; }
        .cell.highlight { background: rgba(255, 255, 255, 0.03); }

        @keyframes hintBlink {
            0%, 100% { background: rgba(255, 255, 0, 0.1); color: var(--neon-accent); box-shadow: 0 0 5px var(--neon-accent); transform: scale(1); }
            50% { background: rgba(255, 255, 0, 0.4); color: #fff; box-shadow: 0 0 20px var(--neon-accent); transform: scale(1.05); }
        }
        .cell.hint-blinking {
            animation: hintBlink 0.6s infinite;
            z-index: 10;
        }

        .cell:nth-child(3n) { border-right: 2px solid var(--neon-primary); }
        .cell:nth-child(n+19):nth-child(-n+27),
        .cell:nth-child(n+46):nth-child(-n+54) { border-bottom: 2px solid var(--neon-primary); }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-4px); }
            75% { transform: translateX(4px); }
        }

        .number-pad {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            margin-bottom: 20px;
            width: 100%;
            max-width: 380px;
        }

        .num-btn {
            height: 45px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--neon-primary);
            color: var(--neon-primary);
            border-radius: 6px;
            font-family: 'Orbitron', sans-serif;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }
        .num-btn:active { transform: scale(0.95); background: var(--neon-primary); color: #000; }
        .num-btn.erase { border-color: #ff0055; color: #ff0055; }
        .num-btn.erase:active { background: #ff0055; color: #fff; }

        .controls {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            width: 100%;
            max-width: 380px;
            margin-bottom: 10px;
        }

        .btn {
            flex: 1;
            background: transparent;
            border: 1px solid var(--neon-secondary);
            color: var(--neon-secondary);
            padding: 12px 10px;
            border-radius: 6px;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.85rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            min-width: 100px;
        }
        .btn:active { transform: scale(0.95); }
        .btn:hover { background: var(--neon-secondary); color: #000; box-shadow: 0 0 15px var(--neon-secondary); }

        .mode-toggle {
            width: 100%;
            max-width: 380px;
            background: transparent;
            border: 1px solid var(--neon-accent);
            color: var(--neon-accent);
            padding: 10px;
            border-radius: 6px;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.9rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 15px;
        }
        .mode-toggle:hover { background: var(--neon-accent); color: #000; }
        .mode-toggle.blitz-active {
            border-color: #ff0055;
            color: #ff0055;
            animation: pulseRed 1.5s infinite;
        }
        .mode-toggle.blitz-active:hover { background: #ff0055; color: #fff; }

        .message {
            margin-top: 10px;
            font-size: 1rem;
            min-height: 25px;
            text-align: center;
            color: var(--neon-accent);
            text-shadow: 0 0 10px var(--neon-accent);
        }

        /* Верхние кнопки */
        .icon-btn {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid var(--neon-primary);
            color: var(--neon-primary);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            font-size: 1.2rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        }
        .icon-btn:hover {
            background: var(--neon-primary);
            color: #000;
            box-shadow: 0 0 15px var(--neon-primary);
        }
        .icon-btn.muted { opacity: 0.5; border-color: #666; color: #666; }

        /* Модальное окно скинов */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal-overlay.active { display: flex; }

        .modal {
            background: var(--bg-panel);
            border: 2px solid var(--neon-primary);
            border-radius: 12px;
            padding: 25px;
            max-width: 400px;
            width: 90%;
            box-shadow: 0 0 30px var(--neon-primary);
        }

        .modal h2 {
            color: var(--neon-primary);
            text-align: center;
            margin-bottom: 20px;
            font-size: 1.3rem;
        }

        .skins-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }

        .skin-card {
            padding: 15px;
            border-radius: 8px;
            cursor: pointer;
            text-align: center;
            font-size: 0.9rem;
            font-weight: bold;
            transition: all 0.3s;
            border: 2px solid transparent;
        }
        .skin-card:hover { transform: scale(1.05); }
        .skin-card.selected { border-color: #fff; box-shadow: 0 0 15px #fff; }

        .skin-card.cyber { background: linear-gradient(135deg, #0a0a0f, #1a0a2e); color: #00ffff; border-color: #00ffff; }
        .skin-card.matrix { background: linear-gradient(135deg, #000, #051505); color: #00ff00; }
        .skin-card.sunset { background: linear-gradient(135deg, #1a0505, #2e0a1a); color: #ff9900; }
        .skin-card.ice { background: linear-gradient(135deg, #050a1a, #0a152e); color: #aaddff; }

        .close-modal {
            width: 100%;
            background: transparent;
            border: 1px solid var(--neon-secondary);
            color: var(--neon-secondary);
            padding: 10px;
            border-radius: 6px;
            font-family: 'Orbitron', sans-serif;
            cursor: pointer;
            font-weight: bold;
        }
        .close-modal:hover { background: var(--neon-secondary); color: #000; }

        /* Экран Game Over */
        .gameover-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 2000;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        .gameover-overlay.active { display: flex; }

        .gameover-content {
            text-align: center;
            padding: 30px;
        }

        .gameover-title {
            font-size: 3rem;
            color: #ff0055;
            text-shadow: 0 0 20px #ff0055, 0 0 40px #ff0055;
            margin-bottom: 20px;
            animation: neonPulse 1s ease-in-out infinite alternate;
        }

        .gameover-stats {
            font-size: 1.2rem;
            color: #fff;
            margin-bottom: 30px;
            line-height: 1.8;
        }
        .gameover-stats span {
            color: var(--neon-accent);
            font-weight: bold;
            font-size: 1.5rem;
        }

        .gameover-btn {
            background: transparent;
            border: 2px solid #00ffff;
            color: #00ffff;
            padding: 15px 40px;
            border-radius: 8px;
            font-family: 'Orbitron', sans-serif;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }
        .gameover-btn:hover {
            background: #00ffff;
            color: #000;
            box-shadow: 0 0 20px #00ffff;
        }

        @media (max-width: 400px) {
            .cell { width: 34px; height: 34px; font-size: 1.1rem; }
            h1 { font-size: 1.5rem; }
            .gameover-title { font-size: 2rem; }
        }
    </style>
</head>
<body>
    <div class="top-bar">
        <button class="icon-btn" id="soundToggle" onclick="toggleSound()">🔊</button>
        <button class="icon-btn" onclick="openSkinsModal()">🎨</button>
    </div>

    <h1>NEON SUDOKU</h1>
    
    <div class="top-bar">
        <div class="level-info">УРОВЕНЬ <span id="level-display">1</span></div>
        <div class="mode-badge" id="modeBadge">ОБЫЧНЫЙ</div>
    </div>

    <div class="blitz-timer" id="blitzTimer">05:00</div>
    <div class="hint-counter">Подсказок сегодня: <span id="hint-count">3</span> / 3</div>

    <div class="sudoku-grid" id="grid"></div>

    <div class="number-pad">
        <button class="num-btn" onclick="inputNumber(1)">1</button>
        <button class="num-btn" onclick="inputNumber(2)">2</button>
        <button class="num-btn" onclick="inputNumber(3)">3</button>
        <button class="num-btn" onclick="inputNumber(4)">4</button>
        <button class="num-btn" onclick="inputNumber(5)">5</button>
        <button class="num-btn" onclick="inputNumber(6)">6</button>
        <button class="num-btn" onclick="inputNumber(7)">7</button>
        <button class="num-btn" onclick="inputNumber(8)">8</button>
        <button class="num-btn" onclick="inputNumber(9)">9</button>
        <button class="num-btn erase" onclick="inputNumber(0)">✕</button>
    </div>

    <div class="controls">
        <button class="btn" onclick="requestHint()">💡 ПОДСКАЗКА</button>
        <button class="btn" onclick="checkSolution()">✅ ПРОВЕРИТЬ</button>
    </div>

    <button class="mode-toggle" id="modeToggle" onclick="toggleMode()">⚡ ВКЛЮЧИТЬ БЛИЦ-РЕЖИМ</button>

    <div class="message" id="message"></div>

    <!-- Модальное окно скинов -->
    <div class="modal-overlay" id="skinsModal">
        <div class="modal">
            <h2>🎨 ВЫБЕРИ ТЕМУ</h2>
            <div class="skins-grid">
                <div class="skin-card cyber" onclick="selectSkin('')">⚡ CYBER</div>
                <div class="skin-card matrix" onclick="selectSkin('skin-matrix')">💚 MATRIX</div>
                <div class="skin-card sunset" onclick="selectSkin('skin-sunset')">🔥 SUNSET</div>
                <div class="skin-card ice" onclick="selectSkin('skin-ice')">❄️ ICE</div>
            </div>
            <button class="close-modal" onclick="closeSkinsModal()">ЗАКРЫТЬ</button>
        </div>
    </div>

    <!-- Экран Game Over -->
    <div class="gameover-overlay" id="gameoverScreen">
        <div class="gameover-content">
            <div class="gameover-title">ВРЕМЯ ВЫШЛО!</div>
            <div class="gameover-stats">
                Ты дошел до уровня: <span id="finalLevel">1</span><br>
                Попробуй еще раз!
            </div>
            <button class="gameover-btn" onclick="restartFromBlitz()">🔄 НАЧАТЬ ЗАНОВО</button>
        </div>
    </div>

    <script>
        // --- ЗВУКОВАЯ СИСТЕМА ---
        let audioCtx = null;
        let soundEnabled = true;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playTone(freq, type, duration, vol = 0.1) {
            if (!soundEnabled || !audioCtx) return;
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(vol, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch(e) {}
        }

        function sfxClick() { playTone(800, 'sine', 0.05, 0.05); }
        function sfxInput() { playTone(600, 'triangle', 0.08, 0.08); playTone(900, 'sine', 0.05, 0.05); }
        function sfxErase() { playTone(200, 'sawtooth', 0.1, 0.06); }
        function sfxSelect() { playTone(400, 'sine', 0.04, 0.04); }
        function sfxHintScan() { 
            playTone(400, 'sine', 0.15, 0.06); 
            setTimeout(() => playTone(600, 'sine', 0.15, 0.06), 150);
            setTimeout(() => playTone(800, 'sine', 0.15, 0.06), 300);
        }
        function sfxHintDone() { 
            playTone(523, 'triangle', 0.15, 0.08);
            setTimeout(() => playTone(659, 'triangle', 0.15, 0.08), 100);
            setTimeout(() => playTone(784, 'triangle', 0.2, 0.08), 200);
        }
        function sfxError() { 
            playTone(150, 'sawtooth', 0.3, 0.1);
            setTimeout(() => playTone(100, 'sawtooth', 0.3, 0.1), 150);
        }
        function sfxWin() {
            const notes = [523, 659, 784, 1047];
            notes.forEach((n, i) => {
                setTimeout(() => playTone(n, 'triangle', 0.2, 0.1), i * 100);
            });
        }
        function sfxLevelUp() {
            playTone(800, 'square', 0.1, 0.08);
            setTimeout(() => playTone(1200, 'square', 0.15, 0.08), 100);
        }
        function sfxGameover() {
            const notes = [400, 350, 300, 200];
            notes.forEach((n, i) => {
                setTimeout(() => playTone(n, 'sawtooth', 0.3, 0.1), i * 150);
            });
        }
        function sfxTick() { playTone(1000, 'sine', 0.03, 0.03); }

        function toggleSound() {
            initAudio();
            soundEnabled = !soundEnabled;
            const btn = document.getElementById('soundToggle');
            if (soundEnabled) {
                btn.textContent = '🔊';
                btn.classList.remove('muted');
                sfxClick();
            } else {
                btn.textContent = '🔇';
                btn.classList.add('muted');
            }
        }

        // --- ИГРОВАЯ ЛОГИКА ---
        let board = [];
        let solution = [];
        let isFixed = [];
        let selectedCell = null;
        let currentLevel = 1;
        
        const MAX_DAILY_HINTS = 3;
        let hintData = { date: new Date().toDateString(), count: 0 };

        // Режим игры
        let gameMode = 'normal'; // 'normal' или 'blitz'
        let blitzTimeLeft = 300; // 5 минут
        let blitzInterval = null;
        const BLITZ_DURATION = 300;

        // --- ИНИЦИАЛИЗАЦИЯ ---
        function init() {
            initAudio();
            loadProgress();
            loadSkin();
            updateHintUI();
            updateModeUI();
            newGame(false);
            
            document.addEventListener('keydown', (e) => {
                if (!selectedCell) return;
                const num = parseInt(e.key);
                if (num >= 1 && num <= 9) inputNumber(num);
                else if (e.key === 'Backspace' || e.key === 'Delete' || e.key === '0') inputNumber(0);
            });
        }

        function loadProgress() {
            const savedLevel = localStorage.getItem('neonSudokuLevel');
            if (savedLevel) currentLevel = parseInt(savedLevel);
            
            const savedHints = localStorage.getItem('neonSudokuHints');
            if (savedHints) {
                hintData = JSON.parse(savedHints);
                if (hintData.date !== new Date().toDateString()) {
                    hintData = { date: new Date().toDateString(), count: 0 };
                    saveHints();
                }
            }
            
            const savedMode = localStorage.getItem('neonSudokuMode');
            if (savedMode === 'blitz') {
                gameMode = 'blitz';
            }
            
            document.getElementById('level-display').textContent = currentLevel;
        }

        function saveProgress() {
            localStorage.setItem('neonSudokuLevel', currentLevel);
            localStorage.setItem('neonSudokuMode', gameMode);
        }

        function saveHints() {
            localStorage.setItem('neonSudokuHints', JSON.stringify(hintData));
            updateHintUI();
        }

        function updateHintUI() {
            document.getElementById('hint-count').textContent = MAX_DAILY_HINTS - hintData.count;
        }

        // --- СИСТЕМА СКИНОВ ---
        function loadSkin() {
            const savedSkin = localStorage.getItem('neonSudokuSkin');
            if (savedSkin !== null) {
                applySkin(savedSkin);
            } else {
                // Первый запуск — случайный скин
                const skins = ['', 'skin-matrix', 'skin-sunset', 'skin-ice'];
                const randomSkin = skins[Math.floor(Math.random() * skins.length)];
                applySkin(randomSkin);
                localStorage.setItem('neonSudokuSkin', randomSkin);
            }
        }

        function applySkin(skinClass) {
            const allSkins = ['skin-matrix', 'skin-sunset', 'skin-ice'];
            allSkins.forEach(s => document.body.classList.remove(s));
            if (skinClass) {
                document.body.classList.add(skinClass);
            }
            updateSkinsModalSelection(skinClass);
        }

        function openSkinsModal() {
            initAudio();
            sfxClick();
            document.getElementById('skinsModal').classList.add('active');
        }

        function closeSkinsModal() {
            sfxClick();
            document.getElementById('skinsModal').classList.remove('active');
        }

        function selectSkin(skinClass) {
            sfxInput();
            applySkin(skinClass);
            localStorage.setItem('neonSudokuSkin', skinClass);
            setTimeout(closeSkinsModal, 300);
        }

        function updateSkinsModalSelection(skinClass) {
            document.querySelectorAll('.skin-card').forEach(card => card.classList.remove('selected'));
            let selector = '';
            if (skinClass === '') selector = '.cyber';
            else if (skinClass === 'skin-matrix') selector = '.matrix';
            else if (skinClass === 'skin-sunset') selector = '.sunset';
            else if (skinClass === 'skin-ice') selector = '.ice';
            
            const selected = document.querySelector(`.skin-card${selector}`);
            if (selected) selected.classList.add('selected');
        }

        // --- РЕЖИМ БЛИЦ ---
        function toggleMode() {
            initAudio();
            sfxClick();
            
            if (gameMode === 'normal') {
                gameMode = 'blitz';
                blitzTimeLeft = BLITZ_DURATION;
                startBlitzTimer();
            } else {
                gameMode = 'normal';
                stopBlitzTimer();
            }
            
            saveProgress();
            updateModeUI();
            newGame(false);
        }

        function updateModeUI() {
            const badge = document.getElementById('modeBadge');
            const toggle = document.getElementById('modeToggle');
            const timer = document.getElementById('blitzTimer');
            
            if (gameMode === 'blitz') {
                badge.textContent = 'БЛИЦ ⚡';
                badge.classList.add('blitz');
                toggle.textContent = '🎯 ВЫКЛЮЧИТЬ БЛИЦ-РЕЖИМ';
                toggle.classList.add('blitz-active');
                timer.classList.add('active');
                updateBlitzTimerDisplay();
            } else {
                badge.textContent = 'ОБЫЧНЫЙ';
                badge.classList.remove('blitz');
                toggle.textContent = '⚡ ВКЛЮЧИТЬ БЛИЦ-РЕЖИМ';
                toggle.classList.remove('blitz-active');
                timer.classList.remove('active');
            }
        }

        function startBlitzTimer() {
            blitzTimeLeft = BLITZ_DURATION;
            updateBlitzTimerDisplay();
            
            blitzInterval = setInterval(() => {
                blitzTimeLeft--;
                updateBlitzTimerDisplay();
                
                // Звук тиканья в последние 30 секунд
                if (blitzTimeLeft <= 30 && blitzTimeLeft > 0) {
                    sfxTick();
                }
                
                if (blitzTimeLeft <= 0) {
                    gameOver();
                }
            }, 1000);
        }

        function stopBlitzTimer() {
            if (blitzInterval) {
                clearInterval(blitzInterval);
                blitzInterval = null;
            }
        }

        function updateBlitzTimerDisplay() {
            const mins = Math.floor(blitzTimeLeft / 60);
            const secs = blitzTimeLeft % 60;
            const display = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
            const timerEl = document.getElementById('blitzTimer');
            timerEl.textContent = display;
            
            // Мигание в последние 30 секунд
            if (blitzTimeLeft <= 30) {
                timerEl.classList.add('warning');
            } else {
                timerEl.classList.remove('warning');
            }
        }

        function gameOver() {
            stopBlitzTimer();
            sfxGameover();
            
            document.getElementById('finalLevel').textContent = currentLevel;
            document.getElementById('gameoverScreen').classList.add('active');
        }

        function restartFromBlitz() {
            sfxClick();
            document.getElementById('gameoverScreen').classList.remove('active');
            currentLevel = 1;
            saveProgress();
            document.getElementById('level-display').textContent = currentLevel;
            blitzTimeLeft = BLITZ_DURATION;
            startBlitzTimer();
            newGame(false);
        }

        // --- ГЕНЕРАЦИЯ СУДОКУ ---
        function generateSudoku() {
            let grid = Array(9).fill().map(() => Array(9).fill(0));
            for (let i = 0; i < 9; i += 3) fillBox(grid, i, i);
            solveSudoku(grid);
            return grid;
        }

        function fillBox(grid, row, col) {
            let nums = [1, 2, 3, 4, 5, 6, 7, 8, 9];
            shuffleArray(nums);
            let idx = 0;
            for (let i = 0; i < 3; i++) {
                for (let j = 0; j < 3; j++) {
                    grid[row + i][col + j] = nums[idx++];
                }
            }
        }

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        function solveSudoku(grid) {
            for (let row = 0; row < 9; row++) {
                for (let col = 0; col < 9; col++) {
                    if (grid[row][col] === 0) {
                        let nums = [1, 2, 3, 4, 5, 6, 7, 8, 9];
                        shuffleArray(nums);
                        for (let num of nums) {
                            if (isValid(grid, row, col, num)) {
                                grid[row][col] = num;
                                if (solveSudoku(grid)) return true;
                                grid[row][col] = 0;
                            }
                        }
                        return false;
                    }
                }
            }
            return true;
        }

        function isValid(grid, row, col, num) {
            for (let x = 0; x < 9; x++) {
                if (grid[row][x] === num) return false;
                if (grid[x][col] === num) return false;
            }
            let startRow = row - row % 3, startCol = col - col % 3;
            for (let i = 0; i < 3; i++) {
                for (let j = 0; j < 3; j++) {
                    if (grid[i + startRow][j + startCol] === num) return false;
                }
            }
            return true;
        }

        function newGame(resetLevel = false) {
            if (resetLevel) {
                currentLevel = 1;
                saveProgress();
                document.getElementById('level-display').textContent = currentLevel;
            }

            solution = generateSudoku();
            board = solution.map(row => [...row]);
            isFixed = Array(9).fill().map(() => Array(9).fill(true));

            // Сложность зависит от режима и уровня
            let removeCount;
            if (gameMode === 'blitz') {
                // В блице фиксированная сложность — легче, чтобы успеть
                removeCount = 40;
            } else {
                // В обычном режиме сложность растет
                removeCount = Math.min(35 + (currentLevel * 2), 60);
            }

            let cells = [];
            for (let i = 0; i < 9; i++) {
                for (let j = 0; j < 9; j++) cells.push([i, j]);
            }
            shuffleArray(cells);

            for (let i = 0; i < removeCount; i++) {
                let [row, col] = cells[i];
                board[row][col] = 0;
                isFixed[row][col] = false;
            }

            selectedCell = null;
            renderGrid();
            showMessage('');
        }

        function renderGrid() {
            const gridEl = document.getElementById('grid');
            gridEl.innerHTML = '';
            
            for (let row = 0; row < 9; row++) {
                for (let col = 0; col < 9; col++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    cell.dataset.row = row;
                    cell.dataset.col = col;
                    
                    if (board[row][col] !== 0) {
                        cell.textContent = board[row][col];
                        cell.classList.add(isFixed[row][col] ? 'given' : 'user-input');
                    }
                    
                    cell.onclick = () => selectCell(row, col);
                    gridEl.appendChild(cell);
                }
            }
        }

        function selectCell(row, col) {
            document.querySelectorAll('.cell').forEach(c => {
                c.classList.remove('selected', 'highlight');
            });
            
            const cell = document.querySelector(`[data-row="${row}"][data-col="${col}"]`);
            cell.classList.add('selected');
            selectedCell = { row, col };
            sfxSelect();
            
            for (let i = 0; i < 9; i++) {
                document.querySelector(`[data-row="${row}"][data-col="${i}"]`).classList.add('highlight');
                document.querySelector(`[data-row="${i}"][data-col="${col}"]`).classList.add('highlight');
            }
            let startRow = row - row % 3, startCol = col - col % 3;
            for (let i = 0; i < 3; i++) {
                for (let j = 0; j < 3; j++) {
                    document.querySelector(`[data-row="${startRow + i}"][data-col="${startCol + j}"]`).classList.add('highlight');
                }
            }
        }

        function inputNumber(num) {
            if (!selectedCell || isFixed[selectedCell.row][selectedCell.col]) return;
            
            board[selectedCell.row][selectedCell.col] = num;
            
            if (num === 0) {
                sfxErase();
            } else {
                sfxInput();
            }
            
            renderGrid();
            selectCell(selectedCell.row, selectedCell.col);
            
            checkIfComplete();
        }

        function checkIfComplete() {
            for (let row = 0; row < 9; row++) {
                for (let col = 0; col < 9; col++) {
                    if (board[row][col] === 0) return;
                }
            }
            setTimeout(() => {
                showMessage('🔍 Автоматическая проверка...');
                checkSolution();
            }, 800);
        }

        function requestHint() {
            initAudio();
            
            if (hintData.count >= MAX_DAILY_HINTS) {
                showMockAdAndGiveHint();
                return;
            }

            hintData.count++;
            saveHints();
            executeHintAnimation();
        }

        function showMockAdAndGiveHint() {
            showMessage('📺 Загрузка рекламы... (посмотри 3 сек)');
            setTimeout(() => {
                showMessage('✅ Спасибо за просмотр! Подсказка активирована.');
                executeHintAnimation();
            }, 3000);
        }

        function executeHintAnimation() {
            let targetRow, targetCol;

            if (selectedCell && board[selectedCell.row][selectedCell.col] === 0) {
                targetRow = selectedCell.row;
                targetCol = selectedCell.col;
            } else {
                let emptyCells = [];
                for (let r = 0; r < 9; r++) {
                    for (let c = 0; c < 9; c++) {
                        if (board[r][c] === 0) emptyCells.push({r, c});
                    }
                }
                if (emptyCells.length === 0) {
                    showMessage('Поле уже заполнено!');
                    return;
                }
                let randomCell = emptyCells[Math.floor(Math.random() * emptyCells.length)];
                targetRow = randomCell.r;
                targetCol = randomCell.c;
                selectedCell = { row: targetRow, col: targetCol };
            }

            const cellEl = document.querySelector(`[data-row="${targetRow}"][data-col="${targetCol}"]`);
            cellEl.classList.add('hint-blinking');
            showMessage('🔍 Сканирование поля...');
            sfxHintScan();

            setTimeout(() => {
                cellEl.classList.remove('hint-blinking');
                board[targetRow][targetCol] = solution[targetRow][targetCol];
                isFixed[targetRow][targetCol] = true;
                renderGrid();
                selectCell(targetRow, targetCol);
                showMessage('✅ Подсказка применена!');
                sfxHintDone();
                
                checkIfComplete();
            }, 1500);
        }

        function checkSolution() {
            let isComplete = true;
            let isCorrect = true;
            
            for (let row = 0; row < 9; row++) {
                for (let col = 0; col < 9; col++) {
                    if (board[row][col] === 0) {
                        isComplete = false;
                    } else if (board[row][col] !== solution[row][col]) {
                        isCorrect = false;
                        const cell = document.querySelector(`[data-row="${row}"][data-col="${col}"]`);
                        if (cell) {
                            cell.classList.add('error');
                            setTimeout(() => cell.classList.remove('error'), 500);
                        }
                    }
                }
            }
            
            if (!isComplete) {
                showMessage('⚠️ Заполни все клетки!');
            } else if (isCorrect) {
                showMessage('🎉 УРОВЕНЬ ПРОЙДЕН!');
                sfxWin();
                setTimeout(() => {
                    levelUp();
                }, 1500);
            } else {
                showMessage('❌ Есть ошибки, проверь красные клетки');
                sfxError();
            }
        }

        function levelUp() {
            sfxLevelUp();
            if (currentLevel % 3 === 0) {
                showMessage('📺 Показ межстраничной рекламы...');
                setTimeout(() => {
                    proceedToNextLevel();
                }, 2000);
            } else {
                proceedToNextLevel();
            }
        }

        function proceedToNextLevel() {
            currentLevel++;
            saveProgress();
            document.getElementById('level-display').textContent = currentLevel;
            
            // В блице таймер сбрасывается на новый уровень
            if (gameMode === 'blitz') {
                stopBlitzTimer();
                blitzTimeLeft = BLITZ_DURATION;
                startBlitzTimer();
            }
            
            newGame(false);
        }

        function showMessage(text) {
            document.getElementById('message').textContent = text;
        }

        init();
    </script>
</body>
