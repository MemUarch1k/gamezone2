<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tactical Neon Command</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');

        :root {
            --bg-dark: #0a0b10;
            --bg-panel: #14161f;
            --neon-green: #00ff9d;
            --neon-red: #ff0055;
            --neon-blue: #00d4ff;
            --neon-yellow: #ffcc00;
            --grid-line: rgba(0, 212, 255, 0.15);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
        
        body {
            font-family: 'Share Tech Mono', monospace;
            background-color: var(--bg-dark);
            color: #e0e0e0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* --- Header / Resources --- */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 15px;
            background: var(--bg-panel);
            border-bottom: 1px solid var(--neon-blue);
            box-shadow: 0 0 15px rgba(0, 212, 255, 0.2);
            z-index: 10;
        }

        .res-box {
            display: flex;
            gap: 15px;
            font-size: 1.1rem;
        }

        .res { display: flex; align-items: center; gap: 5px; }
        .res.energy { color: var(--neon-yellow); }
        .res.materials { color: var(--neon-blue); }
        .res.units { color: var(--neon-green); }

        .audio-btn {
            background: transparent;
            border: 1px solid var(--neon-red);
            color: var(--neon-red);
            padding: 5px 10px;
            font-family: inherit;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.3s;
        }
        .audio-btn.active {
            border-color: var(--neon-green);
            color: var(--neon-green);
            box-shadow: 0 0 10px var(--neon-green);
        }

        /* --- Game Grid --- */
        .game-area {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
            position: relative;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            grid-template-rows: repeat(10, 1fr);
            gap: 2px;
            width: 100%;
            max-width: 500px;
            aspect-ratio: 1 / 1;
            background: var(--grid-line);
            border: 1px solid var(--neon-blue);
            padding: 2px;
            border-radius: 4px;
        }

        .cell {
            background: rgba(10, 11, 16, 0.8);
            border: 1px solid rgba(0, 212, 255, 0.1);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.5rem;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
        }

        .cell:hover { background: rgba(0, 212, 255, 0.1); }
        .cell.selected { border-color: var(--neon-yellow); box-shadow: inset 0 0 10px var(--neon-yellow); }
        .cell.enemy { background: rgba(255, 0, 85, 0.2); border-color: var(--neon-red); animation: pulseRed 1s infinite; }
        .cell.base { background: rgba(0, 255, 157, 0.15); border-color: var(--neon-green); }

        @keyframes pulseRed {
            0%, 100% { box-shadow: 0 0 5px var(--neon-red); }
            50% { box-shadow: 0 0 15px var(--neon-red); }
        }

        /* --- Build Menu --- */
        .build-menu {
            display: flex;
            justify-content: space-around;
            padding: 10px;
            background: var(--bg-panel);
            border-top: 1px solid var(--neon-blue);
        }

        .build-btn {
            background: rgba(0, 212, 255, 0.05);
            border: 1px solid var(--neon-blue);
            color: #fff;
            padding: 10px 5px;
            border-radius: 6px;
            cursor: pointer;
            text-align: center;
            width: 23%;
            transition: all 0.2s;
            font-family: inherit;
        }

        .build-btn:active { transform: scale(0.95); }
        .build-btn.active {
            background: var(--neon-blue);
            color: #000;
            box-shadow: 0 0 15px var(--neon-blue);
            font-weight: bold;
        }
        .build-btn .cost { font-size: 0.7rem; opacity: 0.8; display: block; margin-top: 4px; }
        .build-btn:disabled { opacity: 0.3; cursor: not-allowed; border-color: #555; }

        /* --- Notifications --- */
        .notification {
            position: absolute;
            top: 60px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            border: 1px solid var(--neon-yellow);
            color: var(--neon-yellow);
            padding: 8px 16px;
            border-radius: 4px;
            font-size: 0.9rem;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            z-index: 20;
        }
        .notification.show { opacity: 1; }

        /* CRT Overlay */
        .crt::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%);
            background-size: 100% 4px;
            z-index: 50;
            pointer-events: none;
        }
    </style>
</head>
<body class="crt">

    <div class="header">
        <div class="res-box">
            <div class="res energy">⚡ <span id="res-energy">100</span></div>
            <div class="res materials">🔩 <span id="res-mat">100</span></div>
            <div class="res units">👤 <span id="res-units">0</span>/100</div>
        </div>
        <button class="audio-btn" id="audioBtn" onclick="toggleAudio()">🔇 ЗВУК</button>
    </div>

    <div class="notification" id="notification">Сообщение</div>

    <div class="game-area">
        <div class="grid" id="grid"></div>
    </div>

    <div class="build-menu">
        <button class="build-btn" onclick="selectBuild('mine')" id="btn-mine">
            ⛏️ Шахта
            <span class="cost">⚡20 🔩30</span>
        </button>
        <button class="build-btn" onclick="selectBuild('barracks')" id="btn-barracks">
            🏰 Казарма
            <span class="cost">⚡30 🔩50</span>
        </button>
        <button class="build-btn" onclick="selectBuild('turret')" id="btn-turret">
            🔫 Турель
            <span class="cost">⚡40 🔩40</span>
        </button>
        <button class="build-btn" onclick="selectBuild('unit')" id="btn-unit">
            🤖 Юнит
            <span class="cost">⚡15 🔩10</span>
        </button>
    </div>

    <script>
        // --- Game State ---
        const GRID_SIZE = 10;
        let state = {
            energy: 100,
            materials: 100,
            units: 0,
            maxUnits: 100,
            grid: [], // 10x10 array
            selectedBuild: null,
            wave: 1,
            lastTick: Date.now()
        };

        const BUILDINGS = {
            mine: { icon: '⛏️', costE: 20, costM: 30, hp: 50, type: 'mine' },
            barracks: { icon: '🏰', costE: 30, costM: 50, hp: 100, type: 'barracks' },
            turret: { icon: '🔫', costE: 40, costM: 40, hp: 80, type: 'turret', damage: 20 },
            unit: { icon: '🤖', costE: 15, costM: 10, hp: 30, type: 'unit', damage: 10 },
            base: { icon: '🏛️', costE: 0, costM: 0, hp: 500, type: 'base' }
        };

        // --- Audio System (Procedural) ---
        let audioCtx = null;
        let isAudioOn = false;
        let musicInterval = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playTone(freq, type, duration, vol = 0.1) {
            if (!isAudioOn || !audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(vol, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }

        function sfxBuild() { playTone(150, 'square', 0.15, 0.15); playTone(100, 'sine', 0.2, 0.2); }
        function sfxError() { playTone(100, 'sawtooth', 0.3, 0.2); }
        function sfxCombat() { playTone(800, 'square', 0.05, 0.05); playTone(600, 'sawtooth', 0.1, 0.1); }
        function sfxResource() { playTone(1200, 'sine', 0.1, 0.05); }

        function startMusic() {
            if (!isAudioOn || !audioCtx) return;
            let step = 0;
            // Dark synthwave bassline: C2, C2, G2, F2
            const bassline = [65.41, 65.41, 98.00, 87.31]; 
            const arp = [261.63, 329.63, 392.00, 523.25, 392.00, 329.63];
            
            musicInterval = setInterval(() => {
                if (!isAudioOn) return;
                // Bass
                playTone(bassline[step % 4], 'sawtooth', 0.4, 0.08);
                // Arpeggio every other step
                if (step % 2 === 0) {
                    playTone(arp[(step / 2) % arp.length], 'square', 0.2, 0.03);
                }
                // Hi-hat
                if (step % 2 !== 0) {
                    playTone(8000, 'square', 0.05, 0.02); 
                }
                step++;
            }, 250); // 120 BPM approx
        }

        function toggleAudio() {
            initAudio();
            isAudioOn = !isAudioOn;
            const btn = document.getElementById('audioBtn');
            if (isAudioOn) {
                btn.textContent = '🔊 ЗВУК';
                btn.classList.add('active');
                startMusic();
            } else {
                btn.textContent = '🔇 ЗВУК';
                btn.classList.remove('active');
                clearInterval(musicInterval);
            }
        }

        // --- Game Logic ---
        function initGame() {
            const saved = localStorage.getItem('tacticalNeonSave');
            if (saved) {
                state = JSON.parse(saved);
            } else {
                // Initialize empty grid
                for (let y = 0; y < GRID_SIZE; y++) {
                    let row = [];
                    for (let x = 0; x < GRID_SIZE; x++) {
                        row.push(null);
                    }
                    state.grid.push(row);
                }
                // Place player base in center
                state.grid[4][4] = { ...BUILDINGS.base, hp: BUILDINGS.base.hp };
                state.grid[5][4] = { ...BUILDINGS.base, hp: BUILDINGS.base.hp };
                state.grid[4][5] = { ...BUILDINGS.base, hp: BUILDINGS.base.hp };
                state.grid[5][5] = { ...BUILDINGS.base, hp: BUILDINGS.base.hp };
            }
            renderGrid();
            updateUI();
            setInterval(gameTick, 1000); // 1 second ticks
            setInterval(enemySpawn, 8000); // Enemy every 8 seconds
        }

        function saveGame() {
            localStorage.setItem('tacticalNeonSave', JSON.stringify(state));
        }

        function gameTick() {
            let incomeE = 0;
            let incomeM = 0;
            
            // Calculate income and turret actions
            for (let y = 0; y < GRID_SIZE; y++) {
                for (let x = 0; x < GRID_SIZE; x++) {
                    const cell = state.grid[y][x];
                    if (!cell) continue;

                    if (cell.type === 'mine') {
                        incomeE += 5;
                        incomeM += 2;
                    } else if (cell.type === 'turret') {
                        // Simple combat: damage adjacent enemy
                        damageAdjacentEnemies(x, y, cell.damage);
                    } else if (cell.type === 'unit') {
                        // Units auto-attack adjacent enemies
                        damageAdjacentEnemies(x, y, cell.damage);
                    }
                }
            }

            if (incomeE > 0 || incomeM > 0) {
                state.energy += incomeE;
                state.materials += incomeM;
                if(isAudioOn && (incomeE > 0)) sfxResource();
            }
            
            updateUI();
            saveGame();
        }

        function damageAdjacentEnemies(x, y, damage) {
            const dirs = [[0,1], [0,-1], [1,0], [-1,0]];
            dirs.forEach(([dx, dy]) => {
                const nx = x + dx, ny = y + dy;
                if (nx >= 0 && nx < GRID_SIZE && ny >= 0 && ny < GRID_SIZE) {
                    const target = state.grid[ny][nx];
                    if (target && target.type === 'enemy') {
                        target.hp -= damage;
                        sfxCombat();
                        if (target.hp <= 0) {
                            state.grid[ny][nx] = null;
                            state.energy += 10; // Bounty
                            showNotification("Враг уничтожен! +10⚡");
                        }
                    }
                }
            });
        }

        function enemySpawn() {
            // Spawn enemy at random edge
            const edge = Math.floor(Math.random() * 4);
            let ex, ey;
            if (edge === 0) { ex = Math.floor(Math.random() * GRID_SIZE); ey = 0; }
            else if (edge === 1) { ex = GRID_SIZE - 1; ey = Math.floor(Math.random() * GRID_SIZE); }
            else if (edge === 2) { ex = Math.floor(Math.random() * GRID_SIZE); ey = GRID_SIZE - 1; }
            else { ex = 0; ey = Math.floor(Math.random() * GRID_SIZE); }

            if (!state.grid[ey][ex]) {
                state.grid[ey][ex] = { type: 'enemy', icon: '👾', hp: 40 + (state.wave * 10), maxHp: 40 + (state.wave * 10) };
                state.wave++;
                showNotification(`Волна ${state.wave}: Вражеская высадка!`);
                renderGrid();
            }
        }

        // Enemy movement tick (slower than resource tick)
        setInterval(() => {
            let moved = false;
            // Simple AI: move towards center (4.5, 4.5)
            for (let y = 0; y < GRID_SIZE; y++) {
                for (let x = 0; x < GRID_SIZE; x++) {
                    if (state.grid[y][x] && state.grid[y][x].type === 'enemy') {
                        // Find adjacent empty cell closer to center
                        const dirs = [[0,1], [0,-1], [1,0], [-1,0]];
                        let bestDir = null;
                        let minDist = 999;
                        
                        dirs.forEach(([dx, dy]) => {
                            const nx = x + dx, ny = y + dy;
                            if (nx >= 0 && nx < GRID_SIZE && ny >= 0 && ny < GRID_SIZE) {
                                if (!state.grid[ny][nx]) {
                                    const dist = Math.abs(nx - 4.5) + Math.abs(ny - 4.5);
                                    if (dist < minDist) {
                                        minDist = dist;
                                        bestDir = [nx, ny];
                                    }
                                } else if (state.grid[ny][nx].type === 'base' || state.grid[ny][nx].type === 'mine') {
                                    // Attack building
                                    state.grid[ny][nx].hp -= 10;
                                    sfxCombat();
                                    if (state.grid[ny][nx].hp <= 0) {
                                        state.grid[ny][nx] = null;
                                        showNotification("Здание разрушено!");
                                    }
                                }
                            }
                        });

                        if (bestDir) {
                            state.grid[bestDir[1]][bestDir[0]] = state.grid[y][x];
                            state.grid[y][x] = null;
                            moved = true;
                        }
                    }
                }
            }
            if (moved) renderGrid();
        }, 1500);

        function selectBuild(type) {
            state.selectedBuild = state.selectedBuild === type ? null : type;
            document.querySelectorAll('.build-btn').forEach(b => b.classList.remove('active'));
            if (state.selectedBuild) {
                document.getElementById(`btn-${type}`).classList.add('active');
            }
            renderGrid();
        }

        function handleCellClick(x, y) {
            if (!state.selectedBuild) return;

            const target = state.grid[y][x];
            const buildData = BUILDINGS[state.selectedBuild];

            // Check unit limit
            if (buildData.type === 'unit' && state.units >= state.maxUnits) {
                showNotification("Достигнут лимит в 100 юнитов!");
                sfxError();
                return;
            }

            // Check cost
            if (state.energy < buildData.costE || state.materials < buildData.costM) {
                showNotification("Недостаточно ресурсов!");
                sfxError();
                return;
            }

            // Check if cell is empty (or is base and we are placing unit on it? No, keep it simple: empty only)
            if (target !== null) {
                showNotification("Клетка занята!");
                sfxError();
                return;
            }

            // Build it
            state.energy -= buildData.costE;
            state.materials -= buildData.costM;
            
            if (buildData.type === 'unit') {
                state.units++;
            }

            state.grid[y][x] = { ...buildData, hp: buildData.hp };
            sfxBuild();
            
            state.selectedBuild = null;
            document.querySelectorAll('.build-btn').forEach(b => b.classList.remove('active'));
            
            renderGrid();
            updateUI();
            saveGame();
        }

        function renderGrid() {
            const gridEl = document.getElementById('grid');
            gridEl.innerHTML = '';
            
            for (let y = 0; y < GRID_SIZE; y++) {
                for (let x = 0; x < GRID_SIZE; x++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    const data = state.grid[y][x];
                    
                    if (data) {
                        cell.textContent = data.icon;
                        if (data.type === 'enemy') cell.classList.add('enemy');
                        if (data.type === 'base') cell.classList.add('base');
                        
                        // HP bar for buildings/units
                        if (data.hp !== undefined && data.type !== 'enemy') {
                            const hpPercent = (data.hp / BUILDINGS[data.type === 'unit' ? 'unit' : data.type].hp) * 100;
                            cell.style.boxShadow = `inset 0 -${4 - (hpPercent/25)}px 0 rgba(0, 255, 157, 0.5)`;
                        }
                    }
                    
                    if (state.selectedBuild && !data) {
                        cell.classList.add('selected');
                    }
                    
                    cell.onclick = () => handleCellClick(x, y);
                    gridEl.appendChild(cell);
                }
            }
        }

        function updateUI() {
            document.getElementById('res-energy').textContent = Math.floor(state.energy);
            document.getElementById('res-mat').textContent = Math.floor(state.materials);
            document.getElementById('res-units').textContent = state.units;
            
            // Update button states based on affordability
            for (const [key, data] of Object.entries(BUILDINGS)) {
                if (key === 'base') continue;
                const btn = document.getElementById(`btn-${key}`);
                if (btn) {
                    btn.disabled = (state.energy < data.costE || state.materials < data.costM) || (key === 'unit' && state.units >= state.maxUnits);
                }
            }
        }

        function showNotification(text) {
            const el = document.getElementById('notification');
            el.textContent = text;
            el.classList.add('show');
            setTimeout(() => el.classList.remove('show'), 2000);
        }

        // Start
        initGame();
    </script>
</body>
</html>
